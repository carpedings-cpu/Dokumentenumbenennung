name: Windows-EXE bauen

# Baut die Desktop-App als eigenstaendige Windows-.exe.
# - Manuell ausloesbar ueber den Reiter "Actions" -> "Run workflow".
# - Bei einem Versions-Tag (z. B. v1.0) wird zusaetzlich ein Release mit der
#   .exe als Download angehaengt.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versions-Tag für das Release (z. B. v2.9)"
        required: false
        default: "v2.9"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install pyinstaller anthropic tkinterdnd2 extract-msg pywin32

      - name: Umbenenner-EXE bauen
        run: pyinstaller --noconfirm dokumenten-umbenenner.spec

      - name: Morgenbriefing-EXE bauen
        run: pyinstaller --noconfirm briefing.spec

      - name: EXE als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: KPC-Tools-Windows
          path: |
            dist/Dokumenten-Umbenenner.exe
            dist/KPC-Morgenbriefing.exe
          if-no-files-found: error

      - name: Release anlegen (Versions-Tag oder manueller Start)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          files: |
            dist/Dokumenten-Umbenenner.exe
            dist/KPC-Morgenbriefing.exe
